<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Format Converter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f6fa;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
            font-size: 22px;
        }
        .input-section {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #555;
        }
        textarea {
            width: 100%;
            height: 70px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #3498db;
        }
        .extra-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 15px;
            display: none;
        }
        .extra-grid.active {
            display: grid;
        }
        .extra-grid input {
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }
        .extra-grid input:focus {
            outline: none;
            border-color: #3498db;
        }
        .format-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
        }
        .format-tabs button {
            padding: 10px 24px;
            border: 2px solid #3498db;
            background: #fff;
            color: #3498db;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }
        .format-tabs button:hover {
            background: #ebf5fb;
        }
        .format-tabs button.active {
            background: #3498db;
            color: #fff;
        }
        .btn-generate {
            display: block;
            width: 100%;
            padding: 12px;
            background: #27ae60;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .btn-generate:hover {
            background: #219a52;
        }
        .preview-section {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: none;
        }
        .preview-section.show {
            display: block;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .preview-title {
            font-weight: 700;
            font-size: 16px;
            color: #2c3e50;
        }
        .btn-copy {
            padding: 8px 20px;
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }
        .btn-copy:hover {
            background: #c0392b;
        }
        .missing-alert {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 13px;
            display: none;
        }
        .missing-alert.show {
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 8px 10px;
            text-align: center;
        }
        th {
            background: #f8f9fa;
            font-weight: 700;
            color: #495057;
            white-space: nowrap;
        }
        td {
            background: #fff;
            font-weight: 500;
        }
        tr:hover td {
            background: #f1f3f5;
        }
        .hidden-copy {
            position: absolute;
            left: -9999px;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #27ae60;
            color: #fff;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 600;
            display: none;
            z-index: 1000;
        }
        .toast.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Excel Format Converter</h2>

        <div class="input-section">
            <div class="input-group">
                <label>Heading Input (Excel থেকে Copy করে Paste করুন)</label>
                <textarea id="headingInput" placeholder="Heading row paste করুন..."></textarea>
            </div>

            <div class="input-group">
                <label>Data Input (Excel থেকে Copy করে Paste করুন)</label>
                <textarea id="dataInput" placeholder="Data row(s) paste করুন..."></textarea>
            </div>

            <div class="extra-grid" id="ieExtraInputs">
                <div>
                    <label>Color</label>
                    <input type="text" id="colorInput" placeholder="Color">
                </div>
                <div>
                    <label>Style</label>
                    <input type="text" id="styleInput" placeholder="Style">
                </div>
                <div>
                    <label>Table No</label>
                    <input type="text" id="tableNoInput" placeholder="Table No">
                </div>
                <div>
                    <label>Cut No</label>
                    <input type="text" id="cutNoInput" placeholder="Cut No">
                </div>
            </div>

            <div class="format-tabs">
                <button class="active" onclick="selectFormat('cc')">CC Format</button>
                <button onclick="selectFormat('ie1')">IE Format 1</button>
                <button onclick="selectFormat('ie2')">IE Format 2</button>
            </div>

            <button class="btn-generate" onclick="generate()">Generate Preview</button>
        </div>

        <div class="preview-section" id="previewSection">
            <div class="preview-header">
                <span class="preview-title">Preview (শুধু Data Copy হবে, Heading নয়)</span>
                <button class="btn-copy" onclick="copyData()">Copy Data</button>
            </div>
            <div class="missing-alert" id="missingAlert"></div>
            <div id="previewTableContainer"></div>
        </div>
    </div>

    <textarea id="hiddenCopy" class="hidden-copy"></textarea>
    <div class="toast" id="toast">Copied!</div>

    <script>
        let currentFormat = 'cc';
        let copyText = '';

        function selectFormat(fmt) {
            currentFormat = fmt;
            document.querySelectorAll('.format-tabs button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('ieExtraInputs').classList.toggle('active', fmt === 'ie1');
            document.getElementById('previewSection').classList.remove('show');
        }

        function parseTabData(text) {
            return text.split('\n').map(row => row.split('\t').map(v => v.trim()));
        }

        function getCleanHeadings(headings) {
            return headings.map((h, i) => ({ name: h, index: i, lower: h.toLowerCase() }))
                          .filter(h => h.name !== '');
        }

        function findIndex(cleanHeadings, names) {
            for (let name of names) {
                const found = cleanHeadings.find(h => h.lower === name.toLowerCase());
                if (found) return found.index;
            }
            return -1;
        }

        function findValue(headings, data, names) {
            const idx = findIndex(getCleanHeadings(headings), names);
            return idx >= 0 ? (data[idx] || '') : '';
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function generate() {
            const headingText = document.getElementById('headingInput').value;
            const dataText = document.getElementById('dataInput').value;

            if (!headingText.trim() || !dataText.trim()) {
                alert('Heading এবং Data দুটোই দিন');
                return;
            }

            const headings = headingText.split('\t').map(h => h.trim());
            const dataRows = parseTabData(dataText);

            if (currentFormat === 'cc') {
                generateCC(headings, dataRows);
            } else if (currentFormat === 'ie1') {
                generateIE1(headings, dataRows);
            } else if (currentFormat === 'ie2') {
                alert('IE Format 2 - Coming Soon');
                return;
            }
        }

        function generateCC(headings, dataRows) {
            const clean = getCleanHeadings(headings);
            const pcsIdx = findIndex(clean, ['pcs']);
            const layIdx = findIndex(clean, ['no of plies', 'lay', 'no. of plies', 'plies']);

            if (pcsIdx === -1) {
                alert('Heading এ "Pcs" খুঁজে পাওয়া যায়নি');
                return;
            }
            if (layIdx === -1) {
                alert('Heading এ "No of Plies" বা "Lay" খুঁজে পাওয়া যায়নি');
                return;
            }

            const sizeCols = clean.filter(h => h.index < pcsIdx);
            const sizeNames = sizeCols.map(h => h.name);

            let outputRows = [];
            let previewHtml = '<table><tr>' + sizeNames.map(s => '<th>' + s + '</th>').join('') + '</tr>';

            for (let row of dataRows) {
                if (row.length === 0) continue;
                const lay = parseFloat(row[layIdx]) || 0;
                const outVals = sizeCols.map(h => {
                    const v = parseFloat(row[h.index]) || 0;
                    return v * lay;
                });
                outputRows.push(outVals.join('\t'));
                previewHtml += '<tr>' + outVals.map(v => '<td>' + v + '</td>').join('') + '</tr>';
            }
            previewHtml += '</table>';

            copyText = outputRows.join('\n');
            document.getElementById('previewTableContainer').innerHTML = previewHtml;
            document.getElementById('missingAlert').classList.remove('show');
            document.getElementById('previewSection').classList.add('show');
        }

        function generateIE1(headings, dataRows) {
            const color = document.getElementById('colorInput').value.trim();
            const style = document.getElementById('styleInput').value.trim();
            const tableNo = document.getElementById('tableNoInput').value.trim();
            const cutNo = document.getElementById('cutNoInput').value.trim();

            let missing = [];

            const ieHeaders = [
                'Date', 'Shift', 'Style', 'Group\nQuantity', 'Color', 'Product Type', 
                'AREA', 'Cutting\nNo', 'Pattern No.', 'Pcs / Marker', 'Actual Lay', 
                'Marker Length\nYDS', 'Marker Length\nINCH', 'Marker Width', 
                'Perimeter\nYDS', 'Perimeter\nINCH', 'Marker\nEfficiency %', 
                'Production', 'Team\nName'
            ];

            let outputRows = [];
            let previewHtml = '<table><tr>' + ieHeaders.map(h => '<th>' + h.replace(/\n/g, '<br>') + '</th>').join('') + '</tr>';

            for (let row of dataRows) {
                if (row.length === 0) continue;

                const pcs = findValue(headings, row, ['pcs']);
                const noOfPlies = findValue(headings, row, ['no of plies', 'lay', 'no. of plies', 'plies']);
                const yds = findValue(headings, row, ['yds', 'yards']);
                const inch = findValue(headings, row, ['inch']);
                const markerWidth = findValue(headings, row, ['marker c/w("', 'marker c/w', 'marker cw', 'marker c/w("']);
                const mEff = findValue(headings, row, ['m/ eff', 'm eff', 'efficiency', 'm/eff']);
                const cutDate = findValue(headings, row, ['cut date']);

                const production = ((parseFloat(pcs) || 0) * (parseFloat(noOfPlies) || 0)).toString();

                const outRow = [
                    cutDate, 'Day', style, '', color, '', 'Manual', cutNo, '', 
                    pcs, noOfPlies, yds, inch, markerWidth, yds, '', mEff, production, tableNo
                ];

                outputRows.push(outRow.join('\t'));
                previewHtml += '<tr>' + outRow.map(v => '<td>' + (v || '') + '</td>').join('') + '</tr>';

                if (!cutDate) missing.push('CUT DATE');
                if (!pcs) missing.push('Pcs');
                if (!noOfPlies) missing.push('No of Plies / Lay');
                if (!color) missing.push('Color (extra)');
                if (!style) missing.push('Style (extra)');
                if (!cutNo) missing.push('Cut No (extra)');
                if (!tableNo) missing.push('Table No (extra)');
            }
            previewHtml += '</table>';

            copyText = outputRows.join('\n');
            document.getElementById('previewTableContainer').innerHTML = previewHtml;

            const missingAlert = document.getElementById('missingAlert');
            const uniqueMissing = [...new Set(missing)];
            if (uniqueMissing.length > 0) {
                missingAlert.innerHTML = '⚠️ Missing: ' + uniqueMissing.join(', ');
                missingAlert.classList.add('show');
            } else {
                missingAlert.classList.remove('show');
            }

            document.getElementById('previewSection').classList.add('show');
        }

        function copyData() {
            const hidden = document.getElementById('hiddenCopy');
            hidden.value = copyText;
            hidden.select();
            document.execCommand('copy');
            showToast('Data Copied!');
        }
    </script>
</body>
</html>
