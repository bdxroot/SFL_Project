<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Position Finder</title>
<style>
  :root {
    --bg: #0f1420;
    --card: #171e2e;
    --card2: #1c2438;
    --border: #273049;
    --text: #e8ecf4;
    --dim: #8b95ab;
    --accent: #6c8cff;
    --accent2: #9d6cff;
    --green: #4ade80;
    --red: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, rgba(108,140,255,.15), transparent),
                radial-gradient(900px 500px at -10% 110%, rgba(157,108,255,.12), transparent),
                var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }

  /* ---------- Header ---------- */
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .logo {
    width: 46px; height: 46px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center;
    font-size: 22px; box-shadow: 0 8px 24px rgba(108,140,255,.35);
  }
  .brand h1 { font-size: 20px; font-weight: 700; letter-spacing: .3px; }
  .brand p  { font-size: 12px; color: var(--dim); margin-top: 2px; }

  /* ---------- Panels ---------- */
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }

  label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
  textarea {
    width: 100%; min-height: 170px;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 12px 14px;
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-size: 15px; line-height: 1.7;
    resize: vertical;
    transition: border-color .2s, box-shadow .2s;
  }
  textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,140,255,.15); }
  textarea::placeholder { color: #4a5570; }

  /* ---------- Buttons ---------- */
  .actions { display: flex; gap: 12px; margin: 6px 0 22px; }
  .btn {
    border: none; cursor: pointer;
    padding: 12px 30px; border-radius: 10px;
    font-size: 14px; font-weight: 600; letter-spacing: .4px;
    transition: transform .15s, box-shadow .15s, filter .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    box-shadow: 0 6px 20px rgba(108,140,255,.35);
  }
  .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: var(--dim); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: #3a4568; }

  /* ---------- Output ---------- */
  .hidden { display: none; }
  .section-title {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--dim); margin-bottom: 14px;
  }
  .num-strip {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .chip {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-size: 15px; font-weight: 600;
  }
  .chip.glow { border-color: rgba(108,140,255,.5); box-shadow: 0 0 12px rgba(108,140,255,.18); }

  /* copy icon button */
  .copy-btn {
    background: rgba(108,140,255,.12);
    border: 1px solid rgba(108,140,255,.3);
    color: var(--accent);
    width: 32px; height: 32px; border-radius: 8px;
    cursor: pointer; font-size: 14px;
    display: inline-grid; place-items: center;
    transition: background .2s, transform .15s;
  }
  .copy-btn:hover { background: rgba(108,140,255,.25); transform: translateY(-1px); }

  /* ---------- Position blocks ---------- */
  .pos-block {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 10px;
    font-family: 'JetBrains Mono', 'Consolas', monospace;
  }
  .shadow-row {
    color: var(--dim);
    font-size: 13px;
    padding-left: 118px;
    min-height: 18px;
    opacity: .85;
  }
  .shadow-row .sn { display: inline-block; min-width: 26px; }
  .main-row {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; margin-top: 2px;
  }
  .range { color: var(--accent); font-weight: 700; min-width: 108px; }
  .colon { color: #4a5570; }
  .pos-nums { color: var(--green); font-weight: 700; letter-spacing: .5px; flex: 1; }
  .pos-none { color: #4a5570; font-size: 13px; font-style: italic; flex: 1; }

  /* ---------- Alert ---------- */
  .alert {
    background: rgba(248,113,113,.08);
    border: 1px solid rgba(248,113,113,.35);
    border-left: 4px solid var(--red);
    border-radius: 12px;
    padding: 14px 16px; margin-bottom: 18px;
  }
  .alert strong { color: var(--red); font-size: 13px; display: block; margin-bottom: 6px; }
  .alert .miss { font-family: monospace; color: var(--red); font-size: 14px; }

  /* toast */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #22c55e; color: #fff;
    padding: 10px 22px; border-radius: 999px;
    font-size: 13px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(34,197,94,.4);
    opacity: 0; transition: all .3s ease; pointer-events: none; z-index: 99;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
<base target="_blank">
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="logo">🔢</div>
    <div>
      <h1>Number Position Finder</h1>
      <p>Paste numbers &amp; ranges — get exact positions instantly</p>
    </div>
  </div>

  <div class="panel grid">
    <div>
      <label for="numbers">Numbers</label>
      <textarea id="numbers" placeholder="1&#10;23&#10;45&#10;56&#10;19&#10;37"></textarea>
    </div>
    <div>
      <label for="positions">Positions</label>
      <textarea id="positions" placeholder="1-11,12-34,35,67,70-90"></textarea>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" onclick="runTool()">▶ &nbsp;Run</button>
    <button class="btn btn-ghost" onclick="clearAll()">Clear</button>
  </div>

  <div id="alertBox" class="alert hidden">
    <strong>⚠ Some numbers have no matching position</strong>
    <div class="miss" id="missingList"></div>
    <div style="font-size:12px;color:var(--dim);margin-top:6px;">Add more ranges in the Positions box, then press Run again.</div>
  </div>

  <div id="output" class="hidden">

    <div class="panel">
      <div class="section-title">
        <span>Sorted Numbers · small → big</span>
        <button class="copy-btn" title="Copy" onclick="copyText(sortedNums.join(', '), this)">⧉</button>
      </div>
      <div class="num-strip" id="sortedStrip"></div>
    </div>

    <div class="panel">
      <div class="section-title"><span>Position Result</span></div>
      <div id="posResults"></div>
    </div>

  </div>
</div>

<div id="toast">Copied ✓</div>

<script>
let sortedNums = [];

function parseNumbers(text) {
  return text.split(/[\s,;]+/).map(s => s.trim())
    .filter(s => /^-?\d+$/.test(s)).map(Number);
}
function parsePositions(text) {
  return text.split(/[,;]+/).map(s => s.trim()).filter(Boolean)
    .map(tok => {
      const m = tok.match(/^(\d+)\s*-\s*(\d+)$/);
      if (m) {
        let a = +m[1], b = +m[2];
        if (a > b) [a, b] = [b, a];
        return { label: a + '-' + b, start: a, end: b };
      }
      if (/^\d+$/.test(tok)) return { label: tok, start: +tok, end: +tok };
      return null;
    }).filter(Boolean);
}

function runTool() {
  const numbers = [...new Set(parseNumbers(document.getElementById('numbers').value))].sort((a, b) => a - b);
  const positions = parsePositions(document.getElementById('positions').value);
  if (!numbers.length && !positions.length) { toast('⚠ Input দিন!', true); return; }

  sortedNums = numbers;

  /* Role 1 — sorted chips */
  const strip = document.getElementById('sortedStrip');
  strip.innerHTML = '';
  numbers.forEach(n => {
    const c = document.createElement('span');
    c.className = 'chip'; c.textContent = n;
    strip.appendChild(c);
  });

  /* Role 2 — position blocks */
  const box = document.getElementById('posResults');
  box.innerHTML = '';
  const matched = new Set();

  positions.forEach(pos => {
    const nums = [], poss = [];
    for (const n of numbers) {
      if (n >= pos.start && n <= pos.end) { nums.push(n); poss.push(n - pos.start + 1); matched.add(n); }
    }
    const block = document.createElement('div');
    block.className = 'pos-block';

    /* shadow row : matched numbers aligned over positions */
    const sh = document.createElement('div');
    sh.className = 'shadow-row';
    sh.innerHTML = nums.length
      ? nums.map(n => `<span class="sn">${n}</span>`).join('')
      : '&nbsp;';

    /* main row : range : positions  + copy */
    const main = document.createElement('div');
    main.className = 'main-row';
    const numsStr = nums.join(', ');
    main.innerHTML =
      `<span class="range">${pos.label}</span><span class="colon">:</span>` +
      (nums.length
        ? `<span class="pos-nums">${poss.join(', ')}</span>`
        : `<span class="pos-none">— no match</span>`);

    const cb = document.createElement('button');
    cb.className = 'copy-btn'; cb.title = 'Copy numbers';
    cb.textContent = '⧉';
    cb.onclick = () => nums.length && copyText(numsStr, cb);
    main.appendChild(cb);

    block.appendChild(sh);
    block.appendChild(main);
    box.appendChild(block);
  });

  /* unmatched check */
  const unmatched = numbers.filter(n => !matched.has(n));
  const alertBox = document.getElementById('alertBox');
  if (unmatched.length) {
    document.getElementById('missingList').textContent = unmatched.join(', ');
    alertBox.classList.remove('hidden');
  } else {
    alertBox.classList.add('hidden');
  }

  document.getElementById('output').classList.remove('hidden');
  document.getElementById('output').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    toast('Copied ✓');
    if (btn) { const o = btn.textContent; btn.textContent = '✓'; setTimeout(() => btn.textContent = o, 1200); }
  });
}

let toastTimer;
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isErr ? '#ef4444' : '#22c55e';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

function clearAll() {
  document.getElementById('numbers').value = '';
  document.getElementById('positions').value = '';
  document.getElementById('output').classList.add('hidden');
  document.getElementById('alertBox').classList.add('hidden');
}
</script>
</body>
</html>
